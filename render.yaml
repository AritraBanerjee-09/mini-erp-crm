services:
  # Backend Express REST API Service
  - type: web
    name: mini-erp-crm-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && node scripts/start-with-db-check.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: minierp-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/auth/me

  # Frontend React + Vite Service
  - type: web
    name: mini-erp-crm-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mini-erp-crm-backend
          property: url

databases:
  # Free PostgreSQL Database Instance on Render
  - name: minierp-postgres
    plan: free
    databaseName: minierp
    user: minierp_user
